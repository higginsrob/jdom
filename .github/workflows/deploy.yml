name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Demo Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: |
          # Try npm ci first, fallback to npm install if lock file is out of sync
          npm ci || (echo "⚠️ Lock file out of sync, using npm install instead" && npm install)

      - name: Build production bundle
        run: npm run build

      - name: Create demo site
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          cp test/template.html _site/index.html
          
          # Update the template to use the built jdom.js
          sed -i 's|<head>|<head><script src="./jdom.js"></script>|' _site/index.html
          
          # Copy README styling if it exists
          if [ -f "README/style.css" ]; then
            cp README/style.css _site/
          fi
          
          # Create a simple landing page
          cat > _site/demo.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>JDOM.js Demo</title>
              <script src="./jdom.js"></script>
              <style>
                  :root {
                      --bg: #0a0a0a;
                      --surface: #1a1a1a;
                      --border: #2a2a2a;
                      --text: #f0f0f0;
                      --muted: #a0a0a0;
                      --white: #ffffff;
                  }
                  body {
                      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
                      line-height: 1.6;
                      margin: 0;
                      padding: 20px;
                      color: var(--text);
                      background:
                          radial-gradient(ellipse 80% 50% at 50% -20%, #1f1f1f 0%, transparent 55%),
                          linear-gradient(180deg, #0d0d0d 0%, var(--bg) 40%, #050505 100%);
                      min-height: 100vh;
                  }
                  .container {
                      max-width: 800px;
                      margin: 0 auto;
                      background: var(--surface);
                      border: 1px solid var(--border);
                      padding: 30px;
                      border-radius: 8px;
                  }
                  .demo-section {
                      margin: 30px 0;
                      padding: 20px;
                      border: 1px solid var(--border);
                      border-radius: 4px;
                      background: #141414;
                  }
                  h1, h2 { color: var(--white); }
                  p, li { color: var(--muted); }
                  a { color: var(--muted); }
                  a:hover { color: var(--white); }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🚀 JDOM.js Live Demo</h1>
                  <p>A lightweight DOM builder library with zero dependencies.</p>
                  
                  <div class="demo-section">
                      <h2>Interactive Demo</h2>
                      <div id="demo-container"></div>
                  </div>
                  
                  <div class="demo-section">
                      <h2>Links</h2>
                      <ul>
                          <li><a href="https://github.com/higginsrob/jdom">📚 Documentation</a></li>
                          <li><a href="https://www.npmjs.com/package/jdom">📦 NPM Package</a></li>
                          <li><a href="./index.html">🧪 Test Suite</a></li>
                      </ul>
                  </div>
              </div>
              
              <script>
                  // Demo the library
                  const { domFactory, svgFactory } = window.jdom;
                  const { DIV, BUTTON, INPUT, SPAN } = domFactory;
                  const { svg, circle, rect } = svgFactory;
                  
                  const container = document.getElementById('demo-container');
                  
                  // Interactive button demo
                  let clickCount = 0;
                  const button = BUTTON({
                      parent: container,
                      textContent: 'Click me!',
                      style: {
                          backgroundColor: '#ffffff',
                          color: '#0a0a0a',
                          padding: '10px 20px',
                          border: '1px solid #ffffff',
                          borderRadius: '4px',
                          cursor: 'pointer',
                          margin: '10px 0',
                          fontWeight: '600'
                      },
                      click: function() {
                          clickCount++;
                          this.textContent = \`Clicked \${clickCount} times!\`;
                          const invert = clickCount % 2;
                          this.style.backgroundColor = invert ? '#0a0a0a' : '#ffffff';
                          this.style.color = invert ? '#ffffff' : '#0a0a0a';
                      }
                  });
                  
                  // SVG demo
                  const demoSVG = svg({
                      parent: container,
                      width: 200,
                      height: 100,
                      style: { border: '1px solid #3a3a3a', margin: '10px 0' },
                      children: [
                          rect({ fill: '#141414', width: 200, height: 100 }),
                          circle({ cx: 50, cy: 50, r: 20, fill: '#ffffff' }),
                          circle({ cx: 150, cy: 50, r: 20, fill: '#8a8a8a' })
                      ]
                  });
                  
                  // Form demo
                  const form = DIV({
                      parent: container,
                      style: { marginTop: '20px', color: '#a0a0a0' },
                      children: [
                          DIV({
                              children: [
                                  'Name: ',
                                  INPUT({
                                      type: 'text',
                                      placeholder: 'Enter your name',
                                      style: {
                                          margin: '0 10px',
                                          padding: '5px',
                                          background: '#0a0a0a',
                                          color: '#f0f0f0',
                                          border: '1px solid #3a3a3a',
                                          borderRadius: '4px'
                                      }
                                  })
                              ]
                          })
                      ]
                  });
              </script>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post deployment info
        run: |
          echo "🌐 Demo site deployed successfully!"
          echo "🔗 URL: ${{ steps.deployment.outputs.page_url }}"